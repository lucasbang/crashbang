<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crashbang.sh</title>
  <meta name="description" content="crashbang.sh">

  <link
    rel="icon"
    href="data:image/svg+xml,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <rect width='100' height='100' fill='%23111111'/>
        <text x='50' y='66' text-anchor='middle'
              font-family='monospace' font-size='58'
              fill='%23f3f0e8'>⨳ !</text>
      </svg>">

  <style>
    :root {
      color-scheme: dark;
      --background: #111111;
      --foreground: #f3f0e8;
      --muted: #77736b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--foreground);
      font-family: ui-monospace, "Cascadia Mono", "Liberation Mono",
                   "DejaVu Sans Mono", monospace;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    .mark {
      margin: 0;
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.08em;
      font-size: clamp(6rem, 24vw, 16rem);
      font-weight: 700;
      line-height: 0.82;
    }

    .mark span {
      display: block;
      line-height: 1;
    }

    .crash,
    .bang {
      font-size: 1em;
    }

    .domain {
      margin-top: 2rem;
      color: var(--muted);
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.14em;
      text-transform: lowercase;
    }

    .cursor {
      display: inline-block;
      width: 0.65em;
      height: 1em;
      margin-left: 0.35em;
      vertical-align: -0.14em;
      background: currentColor;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main aria-label="Crash Bang">
    <h1 class="mark"><span class="crash">⨳</span><span class="bang">!</span></h1>
    <div class="domain">crashbang.sh<span class="cursor" aria-hidden="true"></span></div>
  </main>
</body>
</html>
